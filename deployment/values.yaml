# ==============================================================================
# Load Testing Configuration
# ==============================================================================
# -- k6 Load Testing Job configuration
loadTesting:
  # -- Enable load testing job (disabled by default - run on-demand)
  enabled: false
  # -- Component name used in resource naming
  component: load-testing

  # -- Image configuration
  image:
    repository: load-testing
    tag: latest
    pullPolicy: IfNotPresent

  # -- Job configuration
  # Number of retries before marking job as failed
  backoffLimit: 0
  # Seconds to keep job after completion (1 hour)
  ttlSecondsAfterFinished: 3600
  # Maximum runtime in seconds (30 minutes)
  activeDeadlineSeconds: 1800
  # Pod restart policy (Never for jobs)
  restartPolicy: Never

  # -- Override k6 command (default uses entrypoint from image)
  command: []
  # -- k6 arguments (override for different test profiles)
  args:
    - "run"
    - "/scripts/main.ts"

  # -- Additional environment variables
  # Service URLs (CART/CATALOG/CHECKOUT_SERVICE_URL) are auto-injected by template
  env: []
  # Example: Override test duration
  # - name: K6_DURATION
  #   value: "5m"

  # -- Resource limits for k6 container
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 12345
    runAsGroup: 12345
    fsGroup: 12345
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 12345
    runAsGroup: 12345

  # -- Annotations for the Job resource
  annotations: {}

  # -- Pod annotations
  podAnnotations: {}

# ==============================================================================
# LGTM Stack Configuration (Grafana Observability)
# ==============================================================================

# -- Grafana Alloy (OpenTelemetry Collector)
alloy:
  # -- Enable Alloy deployment
  enabled: true

  alloy:
    # -- Alloy configuration
    configMap:
      create: true
      content: |
        // OTLP gRPC receiver
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            metrics = [otelcol.processor.batch.default.input]
            logs    = [otelcol.processor.batch.default.input]
            traces  = [otelcol.processor.batch.default.input]
          }
        }

        // Batch processor for all signals
        otelcol.processor.batch "default" {
          output {
            metrics = [otelcol.exporter.prometheus.mimir.input]
            logs    = [otelcol.exporter.loki.default.input]
            traces  = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // Export traces to Tempo
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "{{ .Release.Name }}-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

        // Export logs to Loki
        otelcol.exporter.loki "default" {
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://{{ .Release.Name }}-loki:3100/loki/api/v1/push"
          }
        }

        // Export metrics to Mimir
        otelcol.exporter.prometheus "mimir" {
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://{{ .Release.Name }}-mimir-nginx/api/v1/push"
          }
        }

        // Kubernetes discovery for scraping
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.kubernetes "nodes" {
          role = "node"
        }

        // Scrape Kubernetes pods with prometheus annotations
        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            regex         = "true"
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            target_label  = "__metrics_path__"
            regex         = "(.+)"
          }

          rule {
            source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            target_label  = "__address__"
            regex         = "([^:]+)(?::\\d+)?;(\\d+)"
            replacement   = "$1:$2"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
        }

        prometheus.scrape "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

  # -- Service configuration for OTLP receivers
  service:
    enabled: true
    type: ClusterIP

  # -- ServiceAccount with RBAC for Kubernetes API access
  serviceAccount:
    create: true

  rbac:
    create: true

# -- Loki (Log aggregation)
loki:
  # -- Enable Loki deployment
  enabled: true

  # -- Deploy as single binary (monolithic mode)
  deploymentMode: SingleBinary

  loki:
    # -- Authentication disabled for demo
    auth_enabled: false

    # -- Common configuration
    commonConfig:
      replication_factor: 1

    # -- Schema configuration
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # -- Storage configuration (S3 for production)
    storage:
      type: s3
      bucketNames:
        chunks: aws-skg-otel-demo-loki-pkarakal
        ruler: aws-skg-otel-demo-loki-pkarakal
        admin: aws-skg-otel-demo-loki-pkarakal
      s3:
        region: eu-west-1

    # -- Ingester configuration
    ingester:
      chunk_encoding: snappy

    # -- Query scheduler configuration
    query_scheduler:
      max_outstanding_requests_per_tenant: 4096

    # -- Query frontend configuration
    frontend:
      max_outstanding_per_tenant: 4096

  # -- Service account with IRSA for S3 access
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::436025701244:role/LokiS3Role

  # -- Single binary configuration
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs

  # -- Disable distributed components
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # -- Disable monitoring components not needed for demo
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false

  # -- Disable test pod
  test:
    enabled: false

  # -- Gateway configuration
  gateway:
    enabled: false

# -- Tempo (Distributed tracing)
tempo:
  # -- Enable Tempo deployment
  enabled: true

  # -- Deploy as single binary (monolithic mode)
  tempo:
    # -- Receivers configuration
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    # -- Storage configuration (S3 for production)
    storage:
      trace:
        backend: s3
        s3:
          bucket: aws-skg-otel-demo-tempo-pkarakal
          region: eu-west-1
        wal:
          path: /var/tempo/wal

  # -- Service account with IRSA for S3 access
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::436025701244:role/TempoS3Role

  # -- Persistence configuration
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ebs

  # -- Service configuration
  service:
    type: ClusterIP

  # -- Tempo-query (Jaeger UI) disabled for demo
  tempoQuery:
    enabled: false

# -- Mimir (Metrics storage) - uses mimir-distributed chart with minimal config
mimir:
  # -- Enable Mimir deployment
  enabled: true

  # -- Global Mimir configuration
  mimir:
    # -- Structured config for Mimir
    structuredConfig:
      # -- Common configuration
      common:
        storage:
          backend: s3
          s3:
            region: eu-west-1
            bucket_name: aws-skg-otel-demo-mimir-pkarakal

      # -- Disable multi-tenancy for demo
      multitenancy_enabled: false

      # -- Ingester configuration
      ingester:
        ring:
          replication_factor: 1

      # -- Store-gateway configuration
      store_gateway:
        sharding_ring:
          replication_factor: 1

      # -- Compactor configuration
      compactor:
        sharding_ring:
          replication_factor: 1

      # -- Limits configuration
      limits:
        max_global_series_per_user: 1500000
        ingestion_rate: 50000
        ingestion_burst_size: 100000

  # -- Service account with IRSA for S3 access
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::436025701244:role/MimirS3Role

  # -- Minimal replicas for demo environment
  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs

  distributor:
    replicas: 1

  querier:
    replicas: 1

  query_frontend:
    replicas: 1

  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs

  compactor:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs

  # -- Disable components not needed for demo
  alertmanager:
    enabled: false

  ruler:
    enabled: false

  # -- Disable built-in MinIO (using S3)
  minio:
    enabled: false

  # -- Nginx gateway configuration
  nginx:
    enabled: true
    replicas: 1

  # -- Disable rollout operator
  rollout_operator:
    enabled: false

# -- Grafana (Visualization)
grafana:
  # -- Enable Grafana deployment
  enabled: true

  # -- Disable password leak check (demo only - use secrets in production)
  assertNoLeakedSecrets: false

  # -- Admin credentials (demo only - use secrets in production)
  adminUser: admin
  adminPassword: admin

  # -- Persistence for dashboards
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ebs

  # -- Pre-configured datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        # -- Mimir for metrics
        - name: Mimir
          type: prometheus
          uid: mimir
          url: http://{{ .Release.Name }}-mimir-nginx/prometheus
          access: proxy
          isDefault: true
          jsonData:
            httpMethod: POST
            prometheusType: Mimir

        # -- Tempo for traces
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://{{ .Release.Name }}-tempo:3200
          access: proxy
          jsonData:
            httpMethod: GET
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              filterByTraceID: true
              filterBySpanID: false
            tracesToMetrics:
              datasourceUid: mimir
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
            serviceMap:
              datasourceUid: mimir
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: loki

        # -- Loki for logs
        - name: Loki
          type: loki
          uid: loki
          url: http://{{ .Release.Name }}-loki:3100
          access: proxy
          jsonData:
            derivedFields:
              - datasourceUid: tempo
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

  # -- Service configuration
  service:
    type: ClusterIP
    port: 80

  # -- Ingress configuration
  ingress:
    enabled: false
    ingressClassName: alb
    annotations:
      kubernetes.io/ingress.class: "alb"
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/group.name: otel-demo
      alb.ingress.kubernetes.io/group.order: "5"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:436025701244:certificate/3da890b1-f5cd-451a-ae13-66e478deda96"
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      external-dns.alpha.kubernetes.io/hostname: grafana.pkarakal.com
    hosts:
      - grafana.pkarakal.com
    path: /
    pathType: Prefix

  # -- Grafana configuration
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    # -- Use PostgreSQL instead of SQLite for better performance
    database:
      type: postgres
      host: "{{ .Release.Name }}-postgresql:5432"
      name: grafana
      user: grafana
      password: grafana_pass
      ssl_mode: disable
    auth.anonymous:
      enabled: true
      org_role: Viewer
    feature_toggles:
      enable: traceToMetrics tempoSearch tempoBackendSearch
