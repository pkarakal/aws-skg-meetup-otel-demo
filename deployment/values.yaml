# Default values for otel-demo Helm chart.
# This is a YAML-formatted file.

# -- Global configuration shared across all components
global:
  # -- Namespace to deploy all resources into
  namespace: otel-demo
  # -- Override the chart name
  nameOverride: ""
  # -- Override the full resource name
  fullnameOverride: ""
  # -- Kubernetes cluster domain for service discovery
  clusterDomain: cluster.local

  # -- Global image configuration
  image:
    # -- Container registry to use for all images (e.g., 436025701244.dkr.ecr.eu-west-1.amazonaws.com)
    registry: "436025701244.dkr.ecr.eu-west-1.amazonaws.com"
    # -- Image pull policy for all containers
    pullPolicy: IfNotPresent
    # -- List of image pull secrets names
    pullSecrets: []

  # -- Labels to add to all resources
  commonLabels: {}
  # -- Annotations to add to all resources
  commonAnnotations: {}
  # -- Labels to add to all pods
  podLabels: {}
  # -- Annotations to add to all pods
  podAnnotations: {}
  # -- Priority class name for all pods
  priorityClassName: ""

# -- RBAC and security configuration
rbac:
  # -- Create RBAC resources
  create: true
  # -- Default pod security context applied to all pods
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  # -- Default container security context applied to all containers
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL

# -- Global service account configuration
serviceAccount:
  # -- Create service accounts
  create: true
  # -- Disable auto-mounting service account tokens
  automount: false
  # -- Annotations to add to all service accounts (e.g., for IRSA)
  annotations: {}

# -- OpenTelemetry telemetry configuration
telemetry:
  # -- Enable telemetry collection
  enabled: true
  # -- OpenTelemetry Collector configuration
  collector:
    # -- Collector service hostname
    host: opentelemetry-demo-otelcol
    # -- gRPC port for OTLP
    grpcPort: 4317
    # -- HTTP port for OTLP
    httpPort: 4318

# -- PostgreSQL subchart configuration (bitnami/postgresql)
postgresql:
  # -- Enable PostgreSQL deployment
  enabled: true
  global:
    defaultStorageClass: ebs
    postgresql:
      auth:
        username: backend
        password: pass
        database: shop
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs
    initdb:
      scripts:
        # -- Create Grafana database and user
        create-grafana-db.sql: |
          CREATE DATABASE grafana;
          CREATE USER grafana WITH ENCRYPTED PASSWORD 'grafana_pass';
          GRANT ALL PRIVILEGES ON DATABASE grafana TO grafana;
          \c grafana
          GRANT ALL ON SCHEMA public TO grafana;

# -- Redis subchart configuration (bitnami/redis)
redis:
  # -- Enable Redis deployment
  enabled: true
  global:
    defaultStorageClass: ebs
    redis:
      password: aRUEHUyavd
  auth:
    enabled: true
    password: aRUEHUyavd
  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ebs

# -- RabbitMQ Cluster Operator subchart configuration (bitnami/rabbitmq-cluster-operator)
rabbitmq:
  # -- Enable RabbitMQ deployment
  enabled: true
  global:
    defaultStorageClass: ebs
  clusterOperator:
    extraEnvVars: []
  msgTopologyOperator:
    extraEnvVars: []
  extraDeploy:
    - apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      metadata:
        name: rabbitmq
      spec:
        replicas: 1
        rabbitmq:
          additionalPlugins:
            - rabbitmq_stream
          additionalConfig: |
            cluster_partition_handling = pause_minority
            disk_free_limit.relative = 1.0
            collect_statistics_interval = 10000
        persistence:
          storageClassName: ebs
          storage: 10Gi

# -- AWS configuration
aws:
  # -- AWS region
  region: eu-west-1
  # -- S3 configuration for catalog service
  s3:
    # -- S3 bucket name for product images
    bucketName: ""

# ==============================================================================
# Cart Service Configuration
# ==============================================================================
cart:
  # -- Enable cart service deployment
  enabled: true
  # -- Component identifier
  component: cart
  # -- Number of replicas (ignored if autoscaling is enabled)
  replicas: 1

  # -- Image configuration
  image:
    # -- Image repository name
    repository: cart
    # -- Image tag
    tag: latest
    # -- Image pull policy override
    pullPolicy: ""

  # -- Container port the application listens on
  containerPort: 8081

  # -- Service configuration
  service:
    # -- Enable service creation
    enabled: true
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 80
    # -- Service annotations
    annotations: {}
    # -- Service labels
    labels: {}

  # -- Ingress configuration
  ingress:
    # -- Enable ingress
    enabled: false
    # -- Ingress class name
    className: alb
    # -- Ingress annotations
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/group.name: otel-demo
      kubernetes.io/ingress.class: "alb"
      alb.ingress.kubernetes.io/group.order: "2"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:436025701244:certificate/3da890b1-f5cd-451a-ae13-66e478deda96"
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      external-dns.alpha.kubernetes.io/hostname: cart.pkarakal.com
    # -- Ingress hosts configuration
    hosts:
      - host: cart.pkarakal.com
        paths:
          - path: /api/v1/cart
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Pod labels
  podLabels: {}
  # -- Pod annotations
  podAnnotations: {}

  # -- Service account configuration
  serviceAccount:
    # -- Create a service account
    create: true
    # -- Service account name (auto-generated if empty)
    name: ""
    # -- Service account annotations (e.g., for IRSA)
    annotations: {}
    # -- Auto-mount service account token
    automount: false

  # -- Pod security context override
  podSecurityContext: {}
  # -- Container security context override
  containerSecurityContext: {}

  # -- Liveness probe configuration
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # -- Readiness probe configuration
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # -- Startup probe configuration
  startupProbe:
    enabled: false
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  # -- Pod disruption budget configuration
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: 1

  # -- Horizontal pod autoscaler configuration
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
    # behavior: {}
    # metrics: []

  # -- Network policy configuration
  networkPolicy:
    enabled: false
    # ingress: []
    # egress: []

  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Affinity rules for pod scheduling
  affinity: {}

  # -- Additional environment variables
  extraEnv: []
  # -- Additional environment variables from secrets/configmaps
  extraEnvFrom: []
  # -- Additional volume mounts
  extraVolumeMounts: []
  # -- Additional volumes
  extraVolumes: []

  # -- ConfigMap configuration
  config:
    # -- Mount path for the config file
    mountPath: /etc/cart
    # -- Config file name
    fileName: config.yaml
    # -- Config items mapping
    items:
      - key: config.yaml
        path: config.yaml
    # -- Config file content (templated)
    content: |
      port: "8081"
      redis:
        server: {{ include "otel-demo.redis.host" . }}
        port: {{ include "otel-demo.redis.port" . }}
        useTLS: false
        auth:
          username: default
          password: {{ include "otel-demo.redis.password" . | quote }}
      telemetry:
        enabled: {{ .Values.telemetry.enabled | quote }}
        collector_url: {{ .Values.telemetry.collector.host | quote }}
        collector_port: {{ .Values.telemetry.collector.grpcPort | quote }}

