  # -- Enable catalog service deployment
  enabled: true
  # -- Component identifier
  component: catalog
  # -- Number of replicas (ignored if autoscaling is enabled)
  replicas: 1

  # -- Image configuration
  image:
    repository: catalog
    tag: latest
    pullPolicy: ""

  # -- Container port the application listens on
  containerPort: 8080

  # -- Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 80
    annotations: {}
    labels: {}

  # -- Ingress configuration
  ingress:
    enabled: false
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/group.name: otel-demo
      kubernetes.io/ingress.class: "alb"
      alb.ingress.kubernetes.io/group.order: "3"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:436025701244:certificate/3da890b1-f5cd-451a-ae13-66e478deda96"
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      external-dns.alpha.kubernetes.io/hostname: catalog.pkarakal.com
