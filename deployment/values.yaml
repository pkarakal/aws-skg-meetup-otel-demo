    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::436025701244:role/CatalogRole
    automount: false

  podSecurityContext: {}
  # -- Container security context override (catalog needs writable tmp for Spring Boot)
  containerSecurityContext:
    readOnlyRootFilesystem: false

  livenessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  startupProbe:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  networkPolicy:
    enabled: false

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Spring Boot environment variables (OTEL endpoint set via extraEnv template below)
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []

  config:
    mountPath: /usr/src/app
    fileName: application-kubernetes.properties
    subPath: application-kubernetes.properties
    items:
      - key: application-kubernetes.properties
        path: application-kubernetes.properties
    content: |
      spring.datasource.url=jdbc:postgresql://{{ include "otel-demo.postgresql.host" . }}:{{ include "otel-demo.postgresql.port" . }}/{{ include "otel-demo.postgresql.database" . }}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC
      spring.datasource.username={{ include "otel-demo.postgresql.username" . }}
      spring.datasource.password={{ include "otel-demo.postgresql.password" . }}
      cloud.aws.region.static={{ .Values.aws.region }}
      cloud.aws.s3.bucket-name={{ .Values.aws.s3.bucketName }}
      minio.enabled=false
      spring.rabbitmq.host={{ include "otel-demo.rabbitmq.host" . }}
      spring.rabbitmq.port={{ include "otel-demo.rabbitmq.port" . }}
      spring.rabbitmq.username=guest
      spring.rabbitmq.password=guest

