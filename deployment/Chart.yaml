apiVersion: v2
name: otel-demo
description: A production-ready Helm chart for deploying the OpenTelemetry Demo microservices

type: application

# Chart version - major bump indicates breaking change from previous structure
version: 1.0.0

# Application version
appVersion: "1.0.0"

maintainers:
  - name: pkarakal

keywords:
  - opentelemetry
  - observability
  - microservices
  - tracing
  - metrics
  - logging

dependencies:
  - name: postgresql
    version: "15.5.32"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "20.1.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq-cluster-operator
    version: "4.3.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
    alias: rabbitmq
